name: 'Build and create GH release'

on:
  push:
    branches: [ master ]
    
  workflow_dispatch:

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(version):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10
          cache: true

      - name: Install dependencies
        run: cd extension && pnpm install

      - name: Build and pack
        run: cd extension && pnpm package

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: extension
          overwrite: true
          compression-level: 0 # no compression
          if-no-files-found: error
          path: extension/dist/web-ext/*

      - name: Generate current version
        run: |
            echo "VERSION=$(jq -r '.version' extension/manifest.json)" >> $GITHUB_ENV

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release exists, uploading asset..."
            gh release upload "v$VERSION" extension/dist/web-ext/* --clobber
          else
            echo "Release does not exist, creating..."
            gh release create "v$VERSION" \
              release-artifacts/ios-build/* \
              --generate-notes \
              --latest=true \
              --title="${GITHUB_REPOSITORY#*/} $VERSION"
          fi